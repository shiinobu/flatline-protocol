<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t:M07.SITE.HC.BRAND}}</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f6f3;--ink:#17191c;--mute:#6b7078;--line:#ddd9d1;--card:#fff;--ok:#1d7a4c;--warn:#b2560d;--bad:#a32433;--focus:#2b6cb0}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:48px 20px 40px}
header{text-align:center;margin-bottom:34px}
.brand{font-size:27px;font-weight:650;letter-spacing:-.02em;margin:0}
.brand span{color:var(--warn)}
.tagline{margin:6px 0 0;font-size:14px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1 1 auto;min-width:0;padding:11px 13px;border:1px solid #c8c3b9;border-radius:7px;background:#fdfdfc;color:var(--ink);font:inherit;font-size:15px}
input:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
button{flex:0 0 auto;padding:11px 20px;border:1px solid #1d2024;border-radius:7px;background:#23272c;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#15181b}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.result{margin-top:22px}
.verdict{border:1px solid var(--line);border-radius:10px;padding:22px 20px;text-align:center;background:var(--card)}
.verdict .word{display:block;font-size:25px;font-weight:650;letter-spacing:-.01em}
.verdict .conf{display:block;margin-top:5px;font-size:13px;color:var(--mute)}
.verdict.ok{border-color:#bfe0cd;background:#f3faf6}.verdict.ok .word{color:var(--ok)}
.verdict.warn{border-color:#e6cdae;background:#fdf7f0}.verdict.warn .word{color:var(--warn)}
.verdict.bad{border-color:#e8c2c7;background:#fdf4f5}.verdict.bad .word{color:var(--bad)}
dl{margin:18px 0 0;display:grid;grid-template-columns:118px 1fr;gap:9px 14px;font-size:13px}
dt{color:var(--mute);font-weight:600}
dd{margin:0}
dd.addr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.state{margin-top:20px;padding:16px;border:1px dashed var(--line);border-radius:9px;text-align:center;font-size:13px;color:var(--mute);background:#fbfaf8}
.hide{display:none}
footer{margin-top:30px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
@media(max-width:480px){.wrap{padding:28px 16px}.row{flex-direction:column}button{width:100%}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 class="brand">Honey<span>Check</span></h1>
  <p class="tagline">{{t:M07.SITE.HC.TAGLINE}}</p>
</header>

<main>
<section class="panel">
  <label for="host">{{t:M07.SITE.HC.PROMPT}}</label>
  <div class="row">
    <input id="host" type="text" autocomplete="off" spellcheck="false"
           placeholder="{{t:M07.SITE.HC.PLACEHOLDER}}" aria-label="{{t:M07.SITE.HC.ARIA_INPUT}}">
    <button id="go" type="button">{{t:M07.SITE.HC.BUTTON}}</button>
  </div>
</section>

<section class="result" aria-live="polite">
  <div id="empty" class="state">{{t:M07.SITE.HC.EMPTY}}</div>
  <div id="unknown" class="state hide">{{t:M07.SITE.HC.UNKNOWN}}</div>
  <div id="card" class="hide">
    <div id="verdict" class="verdict">
      <span id="word" class="word"></span>
      <span id="conf" class="conf"></span>
    </div>
    <dl>
      <dt>{{t:M07.SITE.HC.LABEL_HOST}}</dt><dd id="rhost" class="addr"></dd>
      <dt>{{t:M07.SITE.HC.LABEL_LASTSEEN}}</dt><dd id="rseen"></dd>
      <dt>{{t:M07.SITE.HC.LABEL_SIGNALS}}</dt><dd id="rsignals"></dd>
    </dl>
  </div>
</section>
</main>

<footer>{{t:M07.SITE.HC.FOOTNOTE}}</footer>
</div>

<script>
(function () {
  var DATA = /*__HONEYCHECK_DATA__*/[];
  var TEXT = /*__HONEYCHECK_TEXT__*/{};
  var input = document.getElementById("host");
  var card = document.getElementById("card");
  var empty = document.getElementById("empty");
  var unknown = document.getElementById("unknown");
  var verdict = document.getElementById("verdict");

  function show(el, on) { el.className = el.className.replace(/\s*hide\s*/g, " ").trim() + (on ? "" : " hide"); }

  function render(raw) {
    var q = String(raw || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\/+$/, "");
    if (q === "") { show(empty, true); show(unknown, false); show(card, false); return; }

    var hit = null;
    for (var i = 0; i < DATA.length; i += 1) { if (DATA[i].host.toLowerCase() === q) { hit = DATA[i]; break; } }
    if (hit === null) { show(empty, false); show(unknown, true); show(card, false); return; }

    show(empty, false); show(unknown, false); show(card, true);
    verdict.className = "verdict " + hit.tone;
    document.getElementById("word").textContent = TEXT[hit.verdict] || hit.verdict;
    document.getElementById("conf").textContent = String(TEXT.confidence || "").replace("{{n}}", hit.confidence);
    document.getElementById("rhost").textContent = hit.host;
    document.getElementById("rseen").textContent = hit.lastSeen;
    document.getElementById("rsignals").textContent = hit.signals;
  }

  document.getElementById("go").addEventListener("click", function () { render(input.value); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") render(input.value); });
})();
</script>
</body>
</html>
