<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Consolas, "Courier New", monospace;
    }
    body {
        padding: 6px;
        box-sizing: border-box;
    }
    .banner {
        display: none;
        box-sizing: border-box;
        width: 100%;
        padding: 9px 14px 11px;
        background: rgba(16, 4, 9, 0.93);
        border: 1px solid var(--accent);
        color: var(--accent);
        box-shadow: 0 0 16px var(--glow), inset 0 0 12px rgba(0, 0, 0, 0.55);
        user-select: none;
    }
    .warning {
        --accent: #ff9f1c;
        --glow: rgba(255, 159, 28, 0.35);
    }
    .critical {
        --accent: #ff3b4e;
        --glow: rgba(255, 59, 78, 0.55);
        animation: pulse 0.9s ease-in-out infinite;
    }
    .severed {
        --accent: #35d07f;
        --glow: rgba(53, 208, 127, 0.45);
    }
    .breached {
        --accent: #ff3b4e;
        --glow: rgba(255, 59, 78, 0.6);
    }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }
    .label {
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.22em;
    }
    .timer {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.08em;
    }
    .track {
        height: 4px;
        margin: 8px 0 7px;
        background: rgba(255, 255, 255, 0.08);
    }
    .fill {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.25s linear;
    }
    .detail {
        font-size: 11px;
        color: #e8d9dc;
        letter-spacing: 0.03em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 10px var(--glow), inset 0 0 12px rgba(0, 0, 0, 0.55); }
        50% { box-shadow: 0 0 26px var(--glow), inset 0 0 12px rgba(0, 0, 0, 0.55); }
    }
</style>
</head>
<body>
<div id="banner" class="banner">
    <div class="row">
        <span id="label" class="label"></span>
        <span id="timer" class="timer"></span>
    </div>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div id="detail" class="detail"></div>
</div>
<script>
(function () {
    var VIEW_KEY = "flatlineIncidentView";
    var MAX_EXTRAPOLATION_MS = 2500;
    var RENDER_INTERVAL_MS = 200;
    var banner = document.getElementById("banner");
    var label = document.getElementById("label");
    var timer = document.getElementById("timer");
    var fill = document.getElementById("fill");
    var detail = document.getElementById("detail");

    function pad(value) {
        return value < 10 ? "0" + value : String(value);
    }

    function formatClock(ms) {
        var seconds = Math.max(0, Math.ceil(ms / 1000));
        return pad(Math.floor(seconds / 60)) + ":" + pad(seconds % 60);
    }

    function readView() {
        try {
            return window.HackhubSDK.Variables.get(VIEW_KEY) || null;
        } catch (error) {
            return null;
        }
    }

    function render() {
        var view = readView();
        if (!view) {
            banner.style.display = "none";
            return;
        }

        var live = view.phase === "warning" || view.phase === "critical";
        var elapsed = Math.min(Math.max(0, Date.now() - view.publishedAt), MAX_EXTRAPOLATION_MS);
        var remaining = live ? Math.max(0, view.remainingRealMs - elapsed) : 0;
        var ratio = live ? remaining / view.totalRealMs : (view.phase === "severed" ? 1 : 0);

        banner.className = "banner " + view.phase;
        banner.style.display = "block";
        label.textContent = view.label || "";
        timer.textContent = live ? formatClock(remaining) : "";
        fill.style.width = Math.round(ratio * 100) + "%";
        detail.textContent = view.detail || "";
    }

    setInterval(render, RENDER_INTERVAL_MS);
    render();
})();
</script>
</body>
</html>
