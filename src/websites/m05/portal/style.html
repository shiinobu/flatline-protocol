<style>
:root{color-scheme:dark;--bg:#07110f;--panel:#0d1d19;--panel2:#12261f;--raise:#183229;--line:#1d352d;--line2:#2e4d43;--ink:#eaf5f1;--mute:#a8c0b8;--faint:#7f9a91;--leaf:#38c88e;--ecg:#38c88e;--spo:#5cc8f0;--amber:#f2b84b;--red:#ff6b5e;--leaf-t:rgba(56,200,142,.15);--spo-t:rgba(92,200,240,.16);--amber-t:rgba(242,184,75,.16);--red-t:rgba(255,107,94,.16);--side-a:#0f4c3f;--side-b:#082a22;--dbg:#ff4fa3;--mbg:#060d13;--mpanel:#0b1720;--mraise:#12232e;--mline:#18303d;--mline2:#27475a;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;--num:"Bahnschrift","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace}

.toasts{position:absolute;top:76px;right:20px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.toast{position:relative;overflow:hidden;pointer-events:auto;display:grid;grid-template-columns:32px minmax(0,1fr) 28px;gap:12px;align-items:start;width:min(380px,calc(100vw - 40px));padding:14px 10px 17px 14px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px -16px #000;animation:toastIn .42s cubic-bezier(.16,.84,.3,1)}
.toast.out{opacity:0;transform:translateX(calc(100% + 28px));transition:opacity .22s ease-in,transform .22s ease-in}
.toast .tb{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--leaf);transform-origin:left;animation:toastBar linear forwards}
.toast.game .tb{background:var(--dbg)}
.toast.hold .tb{animation-play-state:paused}
.toast .ti{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--leaf-t);color:var(--leaf)}
.toast b{display:block;font-weight:600;line-height:1.3}
.toast .td{display:block;margin-top:2px;color:var(--mute);font-size:13px;line-height:1.4}
.toast .tx{display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:8px;background:none;color:var(--faint)}
.toast .tx:hover{background:var(--raise);color:var(--ink)}
.toast .tx .ic{width:16px;height:16px}
.toast.game{background:#0a0d10;border:1px dashed var(--dbg)}
.toast.game .ti{background:rgba(255,79,163,.16);color:var(--dbg)}
.toast.game b{color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateX(calc(100% + 28px))}to{opacity:1;transform:none}}
@keyframes toastBar{to{transform:scaleX(0)}}
