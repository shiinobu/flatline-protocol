<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t:M05.SITE.EL.BRAND}}</title>
<style>
*{box-sizing:border-box}
:root{--paper:#faf8f3;--ink:#23201b;--mute:#6f6a60;--rule:#ddd6c8;--accent:#6b4f2a;--focus:#2f5e8f}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Iowan Old Style","Times New Roman",serif;line-height:1.65}
.wrap{max-width:680px;margin:0 auto;padding:44px 22px 36px}
header{border-bottom:3px double var(--rule);padding-bottom:16px;margin-bottom:28px}
.brand{margin:0;font-size:28px;font-weight:normal;letter-spacing:.01em}
.tagline{margin:4px 0 0;font-size:13px;color:var(--mute);font-style:italic}
h1{font-size:18px;font-weight:normal;margin:0 0 10px;letter-spacing:.02em}
.intro{font-size:14px;color:#4a463e;margin:0 0 26px}
.sect{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--rule);padding-bottom:5px;margin:0 0 14px}
ol{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--rule);padding:13px 0}
.cap-date{font-size:15px}
.cap-meta{font-size:12px;color:var(--mute);margin-top:2px}
.empty{font-size:13px;color:var(--mute)}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);font-size:11px;color:var(--mute)}
@media(max-width:480px){.wrap{padding:26px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 class="brand">{{t:M05.SITE.EL.BRAND}}</h1>
  <p class="tagline">{{t:M05.SITE.EL.TAGLINE}}</p>
</header>
<main>
  <h1>{{t:M05.SITE.EL.HOME_TITLE}}</h1>
  <p class="intro">{{t:M05.SITE.EL.HOME_INTRO}}</p>
  /*__EL_GROUPS__*/
</main>
<footer>{{t:M05.SITE.EL.FOOTER}}</footer>
</div>
</body>
</html>
