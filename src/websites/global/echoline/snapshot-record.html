<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t:M06.SITE.AR.TITLE}}</title>
<style>
*{box-sizing:border-box}
:root{--paper:#faf8f3;--ink:#23201b;--mute:#6f6a60;--rule:#ddd6c8;--accent:#6b4f2a;--band:#f2ead6;--bandline:#c9b382;--focus:#2f5e8f}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Iowan Old Style","Times New Roman",serif;line-height:1.65}
.band{background:var(--band);border-bottom:1px solid var(--bandline);padding:9px 18px;font-size:12px;color:#5c4a24}
.wrap{max-width:680px;margin:0 auto;padding:30px 22px 36px}
nav{font-size:12px;margin-bottom:22px}
.page{border:1px solid var(--rule);background:#fff;padding:24px 22px}
h1{font-size:19px;font-weight:normal;margin:0 0 14px}
dl{display:grid;grid-template-columns:190px 1fr;gap:7px 14px;margin:0 0 20px;font-size:13px}
dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);align-self:center}
dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule)}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.note{margin:18px 0 0;font-size:12px;color:var(--mute)}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);font-size:11px;color:var(--mute)}
@media(max-width:520px){.wrap{padding:20px 14px}.page{padding:16px 14px}dl{grid-template-columns:1fr;gap:1px}dd{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="band">/*__AR_BANNER__*/</div>
<div class="wrap">
<nav><a href="/">{{t:M06.SITE.AR.NAV}}</a></nav>
<main class="page">
  <h1>{{t:M06.SITE.AR.TITLE}}</h1>
  <dl>/*__AR_FIELDS__*/</dl>
  <table>
    <thead><tr>
      <th scope="col">{{t:M06.SITE.COL.ENTITY}}</th>
      <th scope="col">{{t:M06.SITE.COL.NUMBER}}</th>
      <th scope="col">{{t:M06.SITE.COL.STATUS}}</th>
    </tr></thead>
    <tbody>/*__AR_ROWS__*/</tbody>
  </table>
  <p class="note">{{t:M06.SITE.AR.NOTE}}</p>
</main>
<footer>{{t:M06.SITE.AR.FOOTER}}</footer>
</div>
</body>
</html>
