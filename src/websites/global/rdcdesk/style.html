:root{color-scheme:dark;--bg:#07110f;--panel:#0d1d19;--panel2:#12261f;--raise:#183229;--line:#1d352d;--line2:#2e4d43;--ink:#eaf5f1;--mute:#a8c0b8;--faint:#7f9a91;--leaf:#38c88e;--ecg:#38c88e;--spo:#5cc8f0;--amber:#f2b84b;--red:#ff6b5e;--leaf-t:rgba(56,200,142,.15);--spo-t:rgba(92,200,240,.16);--amber-t:rgba(242,184,75,.16);--red-t:rgba(255,107,94,.16);--side-a:#0f4c3f;--side-b:#082a22;--dbg:#ff4fa3;--mbg:#060d13;--mpanel:#0b1720;--mraise:#12232e;--mline:#18303d;--mline2:#27475a;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;--num:"Bahnschrift","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
.hide{display:none!important}
.dim{color:var(--faint)}
.sp{flex:1}
:focus-visible{outline:2px solid var(--spo);outline-offset:2px}
h1{margin:0;font:600 28px/1.2 var(--disp)}
h2{margin:0;font:600 18px/1.3 var(--disp)}
.ic{width:18px;height:18px;flex:none}
.ic.up{transform:rotate(180deg)}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 352px;height:100vh}
.shell.nodock{grid-template-columns:minmax(0,1fr)}
.wrap{position:relative;display:flex;flex-direction:column;height:100vh;min-width:0;overflow:hidden;container:stage/inline-size}
#stage{display:flex;flex-direction:column;flex:1;min-height:0}
.side{grid-column:1;grid-row:1/-1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(190deg,var(--side-a) 0%,var(--side-b) 70%,#061f19 100%);box-shadow:inset -1px 0 0 rgba(255,255,255,.07)}
.nav{flex:1;min-height:0;overflow:auto;padding:8px 12px 12px}
.new{display:inline-flex;align-items:center;height:22px;margin-left:auto;padding:0 9px;border-radius:999px;background:var(--spo);color:#04202b;font-size:13px;font-weight:700}
.top{grid-column:2;grid-row:1;display:flex;align-items:center;gap:16px;min-width:0;padding:0 32px;border-bottom:1px solid var(--line);background:rgba(7,17,15,.72);backdrop-filter:blur(10px);z-index:5}
.main{grid-column:2;grid-row:2;min-height:0;overflow:auto}
.page{max-width:1240px;margin:0 auto;padding:30px 32px 64px}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl label{color:var(--mute);font-size:13px;font-weight:500}

.rdc{color-scheme:dark;--rd-bench:#14161a;--rd-frame:#1c1f24;--rd-rail:#262a31;--rd-deep:#181b20;--rd-well:#0d0f12;--rd-line:#2d323a;--rd-line2:#404751;--rd-paper:#eceff3;--rd-fog:#a6adb9;--rd-dim:#868d9a;--rd-ink:#101216;--rd-live:#5be39b;--rd-fault:#ff6b73;--rd-azure:#5cb8ff;--rd-amber:#ffbf5a;--rd-violet:#ab8cff;--rd-teal:#4fd8d0;--rd-rose:#f08a9c;--rd-ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--rd-disp:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;--rd-inst:"Bahnschrift","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--rd-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;--rd-out:cubic-bezier(.16,.84,.24,1);display:flex;flex-direction:column;flex:1;min-height:0;position:relative;background:var(--rd-bench);color:var(--rd-paper);font:400 14px/1.45 var(--rd-ui)}
