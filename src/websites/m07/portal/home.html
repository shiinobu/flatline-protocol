<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t:M07.SITE.PORTAL.BRAND}}</title>
<style>
:root{--void:#0b0708;--panel:#1c1114;--line:#3a1d22;--line2:#5a2630;--blood:#b3182c;--ember:#ff6a5c;--dim:#a79490;--ash:#ede3dc;--paper:#e9e7e2;--paper-2:#dedbd3;--ink:#1c1b1e;--rule:#bdb9b0;--mute:#55525a;--paid:#1f5f43;--head:Bahnschrift,"Arial Narrow","Segoe UI",system-ui,sans-serif;--serif:"Palatino Linotype",Palatino,Georgia,serif;--sans:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"Cascadia Mono","Courier New",monospace;--page-base:#0b0708;--page-bg:radial-gradient(1000px 480px at 12% -14%,#2c0b13 0%,transparent 62%),#0b0708;--page-ink:#ede3dc;--page-soft:#a79490;--bar-bg:transparent;--bar-ink:#ede3dc;--bar-rule:1px solid var(--line);--field-bg:#0b0708;--field-ink:#ede3dc;--ph:#76625f;--blood-hover:#c4122f;--sheet:#e9e7e2;--sheet-edge:#cfcac0;--sheet-shadow:0 18px 50px rgba(0,0,0,.55);--hole:#0b0708;--foot-line:#3a1d22;--foot-ink:#85726e;}
*{box-sizing:border-box}
html{background:var(--page-base)}
body{margin:0;min-height:100vh;background:var(--page-bg);color:var(--page-ink);font:15px/1.6 var(--sans)}
.bar{background:var(--bar-bg);color:var(--bar-ink);border-bottom:var(--bar-rule)}
.bar-in{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mark{flex:0 0 auto;width:38px;height:38px}
.brand{font:700 21px/1.15 var(--head);letter-spacing:.01em}
.tagline{margin-top:4px;font:600 11.5px/1.2 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nav{margin-left:auto;font-size:13.5px;color:var(--ember);border-bottom:1px solid #74212d;padding-bottom:1px}
.wrap{max-width:880px;margin:0 auto;padding:34px 20px 20px}
h1{font:700 30px/1.2 var(--serif);margin:0 0 8px}
.lead{max-width:60ch;color:var(--page-soft);margin:0 0 22px}
.lookup{display:block;padding:20px 20px 22px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blood);color:var(--ash)}
.lookup label{display:block;margin-bottom:8px;font:600 11.5px/1.2 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:10px}
input{flex:1 1 auto;min-width:0;padding:12px 14px;border:2px solid var(--line2);border-radius:2px;background:var(--field-bg);color:var(--field-ink);font:600 19px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
input::placeholder{color:var(--ph);font-weight:400}
button{flex:0 0 auto;padding:12px 24px;border:0;border-radius:2px;background:var(--blood);color:#fff;font:700 15px/1.2 var(--head);letter-spacing:.02em;cursor:pointer}
button:hover{background:var(--blood-hover)}
input:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.state{margin:20px 0 0;font-size:14px;color:var(--page-soft)}
.docket{position:relative;margin:24px 0 0;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-left:30px solid var(--sheet-edge);box-shadow:var(--sheet-shadow)}
.docket::before{content:"";position:absolute;left:-22px;top:14px;bottom:14px;width:12px;background:radial-gradient(circle at 6px 6px,var(--hole) 0 4px,transparent 4.5px) 0 0/12px 26px repeat-y}
.docket.hide,.state.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:20px 24px 14px;border-bottom:3px solid var(--blood)}
.refno{font:700 26px/1.15 var(--mono);letter-spacing:.04em}
.refcap{margin-bottom:4px;font:600 11.5px/1.2 var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stamp{flex:0 0 auto;padding:5px 16px 6px;border:3px double currentColor;border-radius:3px;font:700 20px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase;transform:rotate(-5deg);opacity:.92}
.stamp.paid{color:var(--paid)}
.stamp.reserve{color:var(--blood)}
.docket.fresh .stamp{animation:press .2s ease-out}
@keyframes press{from{transform:rotate(-5deg) scale(1.45);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:.92}}
dl{display:grid;grid-template-columns:190px 1fr;margin:0;padding:6px 24px 16px}
dt,dd{padding:10px 0;border-bottom:1px dotted var(--rule)}
dt{color:var(--mute);font-size:13.5px;padding-right:14px}
dd{margin:0}
dl>dt:last-of-type,dl>dd:last-of-type{border-bottom:0}
.docket.reserve-docket dd.notice{color:var(--blood);font-weight:600}
.help{margin:22px 0 0;max-width:62ch;font-size:13.5px;color:var(--page-soft)}
footer{max-width:880px;margin:0 auto;padding:16px 20px 36px;border-top:1px solid var(--foot-line);font-size:12.5px;color:var(--foot-ink)}
.updated{margin-top:2px}
@media(max-width:720px){.wrap{padding:24px 16px 16px}.bar-in{padding:12px 16px}.row{flex-direction:column}button{width:100%}.top{flex-direction:column;padding:16px 16px 12px}dl{grid-template-columns:1fr;padding:4px 16px 14px}dt{padding-bottom:0;border-bottom:0}dd{padding-top:2px}.docket{border-left-width:18px}.docket::before{left:-14px}footer{padding:14px 16px 28px}}
@media(prefers-reduced-motion:reduce){.docket.fresh .stamp{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
<svg class="mark" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" fill="#1c1114" stroke="#74212d"/><path d="M11 29V9l16 20V9" fill="none" stroke="#c4122f" stroke-width="3" stroke-linejoin="round"/></svg>
<div><div class="brand">{{t:M07.SITE.PORTAL.BRAND}}</div><div class="tagline">{{t:M07.SITE.PORTAL.TAGLINE}}</div></div>
<div class="nav">{{t:M07.SITE.PORTAL.NAV}}</div>
</div></header>
<main class="wrap">
<h1>{{t:M07.SITE.PORTAL.TITLE}}</h1>
<p class="lead">{{t:M07.SITE.PORTAL.LEAD}}</p>
<section class="lookup">
  <label for="ref">{{t:M07.SITE.PORTAL.LABEL}}</label>
  <div class="row">
    <input id="ref" type="text" autocomplete="off" spellcheck="false" maxlength="32"
           placeholder="{{t:M07.SITE.PORTAL.PLACEHOLDER}}" aria-label="{{t:M07.SITE.PORTAL.LABEL}}">
    <button id="go" type="button">{{t:M07.SITE.PORTAL.BUTTON}}</button>
  </div>
</section>
<section aria-live="polite">
  <p id="empty" class="state">{{t:M07.SITE.PORTAL.EMPTY}}</p>
  <p id="none" class="state hide"></p>
  <article id="docket" class="docket hide">
    <div class="top">
      <div><div class="refcap">{{t:M07.SITE.PORTAL.ROW_REF}}</div><div id="refno" class="refno"></div></div>
      <div id="stamp" class="stamp"></div>
    </div>
    <dl id="rows"></dl>
  </article>
</section>
<p class="help">{{t:M07.SITE.PORTAL.HELP}}</p>
</main>
<footer>{{t:M07.SITE.PORTAL.FOOTER}}<div class="updated">{{t:M07.SITE.PORTAL.UPDATED}}</div></footer>
<script>
(function () {
  var UNAVAILABLE = "{{t:M07.SITE.PORTAL.UNAVAILABLE}}";
  var input = document.getElementById("ref");
  var empty = document.getElementById("empty");
  var none = document.getElementById("none");
  var docket = document.getElementById("docket");
  var rows = document.getElementById("rows");
  var refno = document.getElementById("refno");
  var stamp = document.getElementById("stamp");

  function setHidden(el, hidden) {
    var cls = el.className.replace(/\s*hide\s*/g, " ").trim();
    el.className = hidden ? (cls + " hide").trim() : cls;
  }

  function lookup(raw) {
    try { return typeof flatlineClaimLookup === "function" ? flatlineClaimLookup(String(raw)) : null; } catch (e) { return null; }
  }

  function clearRows() { while (rows.firstChild) rows.removeChild(rows.firstChild); }

  function showMessage(text) {
    clearRows();
    setHidden(empty, true);
    setHidden(docket, true);
    none.textContent = text;
    setHidden(none, false);
  }

  function showResult(result) {
    clearRows();
    setHidden(empty, true);
    setHidden(none, true);
    refno.textContent = result.ref;
    stamp.textContent = result.badge;
    stamp.className = "stamp " + result.tone;
    for (var i = 0; i < result.rows.length; i += 1) {
      var dt = document.createElement("dt");
      var dd = document.createElement("dd");
      dt.textContent = result.rows[i].label;
      dd.textContent = result.rows[i].value;
      if (result.tone === "reserve" && i === result.rows.length - 1) dd.className = "notice";
      rows.appendChild(dt);
      rows.appendChild(dd);
    }
    docket.className = "docket" + (result.tone === "reserve" ? " reserve-docket" : "");
    void docket.offsetWidth;
    docket.className += " fresh";
  }

  function run() {
    var raw = String(input.value || "").trim();
    if (raw === "") {
      clearRows();
      setHidden(none, true);
      setHidden(docket, true);
      setHidden(empty, false);
      return;
    }
    var result = lookup(raw);
    if (result === null || typeof result !== "object") { showMessage(UNAVAILABLE); return; }
    if (!result.found) { showMessage(result.message); return; }
    showResult(result);
  }

  document.getElementById("go").addEventListener("click", run);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
})();
</script>
</body>
</html>
