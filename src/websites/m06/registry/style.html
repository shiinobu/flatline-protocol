<style>
*{box-sizing:border-box}
:root{--ink:#14232f;--teal:#0f6c75;--deep:#0a4b52;--paper:#f3f6f7;--card:#ffffff;--amber:#9a4a07;--amber-bg:#fdf1de;--amber-edge:#e6c28f;--rule:#d3dde2;--mute:#51636e;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"Cascadia Mono","Courier New",monospace}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
.bar{background:var(--ink);color:#e9f1f3;border-bottom:3px solid var(--teal)}
.bar-in{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mark{flex:0 0 auto;width:36px;height:36px}
.brand{font:600 20px/1.2 var(--serif)}
.tagline{font-size:12.5px;color:#a9bfc6}
.bar a{margin-left:auto;font-size:13px;color:#d3e8ec;text-decoration:none;border-bottom:1px solid #3f6f77;white-space:nowrap}
.bar a:hover{color:#fff;border-bottom-color:#fff}
.wrap{max-width:960px;margin:0 auto;padding:30px 20px 24px}
h1{font:600 29px/1.2 var(--serif);margin:0 0 8px}
.lead{max-width:66ch;color:#34464f;margin:0 0 18px}
a{color:var(--teal)}
a:hover{color:var(--deep)}
a:focus-visible,input:focus-visible,button:focus-visible,.seal:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.search{margin-top:22px;padding:18px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--teal)}
.search label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1 1 auto;min-width:0;padding:11px 13px;border:1px solid #9fb2ba;background:#fff;color:var(--ink);font:inherit;font-size:16px}
button{flex:0 0 auto;padding:11px 22px;border:0;background:var(--teal);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:var(--deep)}
.state{margin:18px 0 0;font-size:14px;color:var(--mute)}
.count{margin:22px 0 8px;font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--rule)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:13px;font-weight:600;color:var(--mute);background:#eaf0f2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px}
.sub{margin:0 0 4px;font-size:13.5px;color:var(--mute)}
.status{display:inline-block;font-size:13px;padding:2px 11px;border:1px solid var(--rule);background:#fff;color:var(--mute);border-radius:999px}
.status.flag{border-color:var(--amber-edge);background:var(--amber-bg);color:var(--amber)}
.plate{flex:0 0 auto;text-align:center;padding:7px 18px 9px;margin:4px 5px 0 0;background:#fff;border:2px solid var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.plate span{display:block;font-size:11.5px;color:var(--mute)}
.plate b{display:block;font:700 22px/1.25 var(--mono);letter-spacing:.06em}
.cols{display:block}
.cols.has-side{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:0 36px}
.section{font:600 17px/1.3 var(--serif);margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.cols>.main>.section:first-child,.side>.section:first-child{margin-top:20px}
dl{display:grid;grid-template-columns:230px 1fr;gap:8px 16px;margin:0}
dt{color:var(--mute);font-size:13.5px}
dd{margin:0}
.note{margin:14px 0 0;max-width:66ch;font-size:14px;color:#34464f}
ul.links{list-style:none;margin:0;padding:0}
ul.links li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.notice{padding:11px 14px;border:1px solid var(--amber-edge);background:var(--amber-bg);color:var(--amber);font-size:14px;margin:0 0 14px}
.seal{margin:0;padding:14px 16px;background:#10202a;color:#9fe0d4;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;user-select:all;border-left:4px solid var(--teal);cursor:copy}
footer{max-width:960px;margin:0 auto;padding:16px 20px 36px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--mute)}
.updated{margin-top:2px}
.hide{display:none}
@media(max-width:720px){.wrap{padding:22px 16px 18px}.bar-in{padding:12px 16px}.cols.has-side{display:block}dl{grid-template-columns:1fr;gap:2px 0}dt{margin-top:10px}.head{flex-direction:column;gap:12px}.row{flex-direction:column}button{width:100%}footer{padding:14px 16px 28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
