<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frostgate Exchange</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#070a0c;color:#c9d6d8;font-family:Consolas,Monaco,"Courier New",monospace;padding:28px 24px}
  header{border:1px solid #1c2c33;background:#0a1216;padding:18px 22px;margin-bottom:18px}
  h1{margin:0;color:#7fd0ff;letter-spacing:2px;font-size:22px}
  .tag{color:#748a92;font-size:12px;margin-top:6px}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  input,select{background:#080f12;border:1px solid #1c2c33;color:#adc0c5;padding:10px 12px;font:12px inherit;outline:none}
  input{flex:1;min-width:180px}input:focus,select:focus{border-color:#3f6b7f}
  .stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .stat{border:1px solid #16262c;background:#080f12;padding:8px 12px;font-size:11px;color:#748a92}
  .stat b{color:#c9d6d8}
  .layout{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start}
  table{width:100%;border-collapse:collapse;background:#080f12;border:1px solid #1c2c33}
  th{text-align:left;color:#597781;font-size:10px;font-weight:normal;letter-spacing:1px;padding:11px;border-bottom:1px solid #1c2c33}
  td{padding:12px 11px;border-bottom:1px solid #101c20;font-size:12px}
  tr:hover td{background:#0c161a}
  .label{color:#d7e6ea;font-weight:bold}
  .cat{color:#748a92}
  .desc{color:#63767c}
  .sold{color:#4c5a5f}
  .active-status{color:#6fd8ff}
  a.open{color:#7fd0ff;text-decoration:none;border:1px solid #294a56;padding:5px 10px;font-size:10px}
  a.open:hover{background:#0f1e24;border-color:#3f6b7f}
  .side{border:1px solid #1c2c33;background:#080f12;padding:16px}
  .side-title{color:#5d7c8c;font-size:9px;letter-spacing:2px;margin-bottom:14px}
  .metric{margin-bottom:16px}
  .metric-label{display:flex;justify-content:space-between;color:#597781;font-size:9px;margin-bottom:6px}
  .metric-bar{height:4px;background:#0e1a1f}
  .metric-fill{height:100%;background:#4ec9e9}
  footer{margin-top:16px;color:#3a4e54;font-size:10px}
  @media(max-width:760px){
    .layout{grid-template-columns:1fr}
    table,thead,tbody,tr,th,td{display:block}
    thead{display:none}
    tr{border-bottom:1px solid #16262c;padding:10px 0}
    td{border:0;padding:3px 0}
  }
</style>
</head>
<body>
<header>
  <h1>FROSTGATE EXCHANGE</h1>
  <div class="tag">verified network access, mirror of the usual channels. serious buyers only.</div>
</header>

<div class="toolbar">
  <input id="search" placeholder="search listing, region, sector...">
  <select id="category">
    <option value="ALL">ALL CATEGORIES</option>
    <option>RETAIL</option><option>ISP</option><option>LOGISTICS</option>
    <option>EDU</option><option>GOV</option><option>FIN</option><option>TELECOM</option>
  </select>
</div>

<div class="stats">
  <div class="stat">LISTINGS <b id="total">0</b></div>
  <div class="stat">ACTIVE <b id="active">0</b></div>
</div>

<div class="layout">
  <table>
    <thead><tr><th>LISTING</th><th>CATEGORY</th><th>DETAIL</th><th>STATUS</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <aside class="side">
    <div class="side-title">EXCHANGE METRICS</div>
    <div class="metric"><div class="metric-label"><span>LIQUIDITY</span><span>68%</span></div><div class="metric-bar"><div class="metric-fill" style="width:68%"></div></div></div>
    <div class="metric"><div class="metric-label"><span>UPTIME</span><span>94%</span></div><div class="metric-bar"><div class="metric-fill" style="width:94%"></div></div></div>
    <div class="metric"><div class="metric-label"><span>INDEX SYNC</span><span>99%</span></div><div class="metric-bar"><div class="metric-fill" style="width:99%"></div></div></div>
  </aside>
</div>

<footer>FROSTGATE EXCHANGE // FICTIONAL NETWORK NODE // payments secured via <a href="https://clearescrow.io/" style="color:#7fd0ff;">ClearEscrow</a></footer>

<script>
const LOTS = [
  { slug: null, label: "ISP-EU-3302", cat: "ISP", desc: "Regional ISP, EU" },
  { slug: null, label: "EDU-NA-7710", cat: "EDU", desc: "no longer listed" },
  { slug: null, label: "FIN-APAC-2244", cat: "FIN", desc: "no longer listed" },
  { slug: null, label: "RETAIL-NA-6650", cat: "RETAIL", desc: "no longer listed" },
  { slug: null, label: "LOGISTICS-EU-1183", cat: "LOGISTICS", desc: "no longer listed" },
  { slug: null, label: "GOV-APAC-9042", cat: "GOV", desc: "no longer listed" },
  { slug: "telecom-eu-5518", label: "TELECOM-EU-5518", cat: "TELECOM", desc: "Telecom carrier, EU region" },
  { slug: "retail-apac-3390", label: "RETAIL-APAC-3390", cat: "RETAIL", desc: "Retail chain, APAC region" },
  { slug: "isp-na-7734", label: "ISP-NA-7734", cat: "ISP", desc: "Regional ISP, NA region" },
  { slug: "logistics-apac-2261", label: "LOGISTICS-APAC-2261", cat: "LOGISTICS", desc: "Logistics company, APAC region" },
];

const shuffle = (arr) => {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
};
const DATA = shuffle(LOTS);

const rows = document.getElementById("rows");

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const c = document.getElementById("category").value;
  const data = DATA.filter(x =>
    (c === "ALL" || x.cat === c) &&
    [x.label, x.cat, x.desc].join(" ").toLowerCase().includes(q)
  );
  rows.innerHTML = data.map(x => `
    <tr>
      <td class="label">${x.label}</td>
      <td class="cat">${x.cat}</td>
      <td class="desc">${x.desc}</td>
      <td class="${x.slug ? "active-status" : "sold"}">${x.slug ? "ACTIVE" : "SOLD"}</td>
      <td>${x.slug ? `<a class="open" href="/${x.slug}/">OPEN</a>` : ""}</td>
    </tr>`).join("");
  document.getElementById("total").textContent = data.length;
  document.getElementById("active").textContent = data.filter(x => x.slug).length;
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("category").addEventListener("change", render);
render();
</script>
</body>
</html>
