<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerVault</title>
<style>
*{box-sizing:border-box}

:root{
    --bg:#08090b;
    --surface:#0f1114;
    --surface2:#14171a;
    --surface3:#191c20;
    --border:#292d32;
    --border-soft:#202328;
    --text:#ececef;
    --muted:#8a8c92;
    --muted2:#60636a;
    --red:#e33443;
    --red-dark:#8f202a;
    --red-soft:#b52b37;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-transform:uppercase;
}

.topbar{
    height:64px;
    background:#090a0c;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 30px;
    position:relative;
}

.topbar:after{
    content:"";
    position:absolute;
    left:30px;
    bottom:-1px;
    width:88px;
    height:2px;
    background:var(--red);
}

.logo{
    color:#f2f2f3;
    font-size:19px;
    font-weight:700;
    letter-spacing:.05em;
}

.user{
    margin-left:auto;
    color:#7c7f85;
    font-size:13px;
    letter-spacing:.04em;
}

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:216px;
    background:#0c0e11;
    border-right:1px solid var(--border);
    padding:25px 12px;
}

.nav-title{
    color:#5f636a;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.13em;
    padding:0 12px 10px;
}

.nav-item{
    display:block;
    padding:11px 12px;
    margin-bottom:3px;
    border-radius:0;
    border-left:2px solid transparent;
    color:#94979d;
    text-decoration:none;
    font-size:14px;
    letter-spacing:.03em;
    transition:.15s ease;
}

.nav-item:hover{
    background:#15181c;
    color:#e4e4e6;
}

.nav-item.active{
    background:#181b20;
    color:#f0f0f1;
    border-left-color:var(--red);
}

.main{
    flex:1;
    max-width:1180px;
    padding:36px 44px 54px;
}

.breadcrumb{
    color:var(--muted2);
    font-size:13px;
    margin-bottom:21px;
    letter-spacing:.08em;
}

.breadcrumb a,.back{
    color:#b0b2b8;
    text-decoration:none;
    cursor:pointer;
}

.breadcrumb a:hover{
    color:#fff;
}

.breadcrumb span{
    margin:0 9px;
    color:#45484e;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:17px;
}

.title{
    color:#f1f1f2;
    font-size:30px;
    font-weight:600;
    letter-spacing:-.02em;
}

.search{
    margin-left:auto;
    width:285px;
    height:44px;
    background:#0e1013;
    border:1px solid var(--border);
    border-radius:2px;
    color:#d1d3d7;
    padding:0 13px;
    outline:none;
    font:inherit;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.search::placeholder{
    color:#5f6268;
}

.search:focus{
    border-color:var(--red-dark);
    background:#111316;
}

.file-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
}

.file-table th{
    text-align:left;
    color:#686c73;
    font-size:12px;
    font-weight:600;
    padding:13px 17px;
    background:#131519;
    border-bottom:1px solid var(--border);
    letter-spacing:.1em;
}

.file-table td{
    padding:16px 17px;
    border-bottom:1px solid var(--border-soft);
    color:#b4b7bd;
    font-size:14px;
    letter-spacing:.02em;
}

.file-table tr:last-child td{
    border-bottom:none;
}

.file-table tbody tr{
    transition:.12s ease;
}

.file-table tbody tr:hover{
    background:#171a1e;
}

.name{
    width:60%;
}

.folder{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:#dadadd;
    text-decoration:none;
    cursor:pointer;
    font-weight:500;
}

.folder:hover{
    color:#fff;
}

.icon{
    display:inline-flex;
    width:25px;
    height:21px;
    align-items:center;
    justify-content:center;
    border-radius:1px;
    color:#d3d4d7;
    background:#202329;
    border:1px solid #34383e;
    font-size:10px;
}

.folder:hover .icon{
    background:var(--red-dark);
    border-color:var(--red-soft);
}

.modified{
    color:#777b82;
}

.type{
    color:#63676e;
}

.summary{
    padding:13px 2px;
    color:#5f636a;
    font-size:11px;
    letter-spacing:.1em;
}

footer{
    margin-top:56px;
    padding-top:17px;
    border-top:1px solid var(--border-soft);
    color:#4d5157;
    font-size:10px;
    letter-spacing:.08em;
}

.hidden{
    display:none;
}

.folder-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:22px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border-soft);
    position:relative;
}

.folder-header:after{
    content:"";
    position:absolute;
    bottom:-1px;
    left:0;
    width:72px;
    height:2px;
    background:var(--red);
}

.folder-page-title{
    color:#f1f1f2;
    font-size:31px;
    font-weight:700;
    letter-spacing:.01em;
    margin:0;
}

.back{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    color:#d8d9dc;
    text-decoration:none;
    cursor:pointer;
    background:#15181c;
    border:1px solid #353941;
    border-radius:2px;
    padding:11px 16px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    transition:.15s ease;
}

.back:hover{
    background:#1b1e23;
    border-color:var(--red);
    color:#fff;
}

.file-list{
    border:1px solid var(--border);
    border-radius:2px;
    overflow:hidden;
    background:var(--surface);
}

.file-row{
    display:flex;
    align-items:center;
    min-height:132px;
    padding:18px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
    transition:.12s ease;
}

.file-row:last-child{
    border-bottom:none;
}

.file-row:hover{
    background:#171a1e;
    box-shadow:inset 2px 0 0 var(--red);
}

.file-thumb{
    width:210px;
    height:126px;
    object-fit:cover;
    margin-right:21px;
    background:#17191c;
    border:1px solid #30343a;
    border-radius:1px;
    flex:none;
}

.file-name{
    color:#d8dade;
    flex:1;
    font-size:15px;
    font-weight:600;
    letter-spacing:.03em;
}

.file-meta{
    color:#747880;
    font-size:12px;
    min-width:112px;
    text-align:right;
    letter-spacing:.05em;
}

.file-type{
    width:76px;
    color:#656970;
    font-size:11px;
    text-align:right;
    letter-spacing:.08em;
}

.viewer{
    position:fixed;
    inset:0;
    background:rgba(4,5,7,.97);
    display:none;
    align-items:center;
    justify-content:center;
    padding:36px;
    z-index:10;
}

.viewer.show{
    display:flex;
}

.viewer-content{
    max-width:1180px;
    width:100%;
    text-align:center;
}

.viewer img{
    max-width:100%;
    max-height:84vh;
    object-fit:contain;
    border:1px solid #34383e;
    border-radius:1px;
    background:#08090b;
    box-shadow:0 24px 80px rgba(0,0,0,.55);
}

.viewer-name{
    margin-top:15px;
    color:#a6a9af;
    font-size:12px;
    letter-spacing:.08em;
}

.close{
    position:absolute;
    top:18px;
    right:24px;
    width:40px;
    height:40px;
    border:1px solid #393d44;
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a3a6ac;
    font-size:23px;
    cursor:pointer;
    background:#121419;
}

.close:hover{
    color:#fff;
    background:#191c21;
    border-color:var(--red);
}

.preload{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
}

@media(max-width:860px){
    .sidebar{width:185px}
    .main{padding:30px 24px 44px}
    .search{width:235px}
    .file-thumb{width:165px;height:105px}
}

@media(max-width:720px){
    .sidebar{display:none}
    .main{padding:24px 16px 36px}
    .toolbar{align-items:flex-start;flex-direction:column;gap:13px}
    .search{margin-left:0;width:100%}
    .file-table th:nth-child(3),.file-table td:nth-child(3){display:none}
    .file-row{min-height:108px;padding:14px}
    .file-thumb{width:135px;height:88px;margin-right:15px}
    .file-meta{min-width:auto;margin-left:12px}
    .file-type{display:none}
    .folder-header{align-items:flex-start}
}

@media(max-width:500px){
    .topbar{padding:0 16px}
    .topbar:after{left:16px}
    .main{padding:19px 10px 30px}
    .file-table th:nth-child(2),.file-table td:nth-child(2){display:none}
    .file-row{min-height:98px}
    .file-thumb{width:112px;height:73px}
    .file-name{font-size:12px}
    .folder-header{gap:12px;flex-direction:row}
    .folder-page-title{font-size:22px}
    .back{font-size:11px;padding:10px 12px}
    .viewer{padding:18px}
}
</style>
</head>

function showHome(){
document.getElementById("homePage").classList.remove("hidden");
document.getElementById("folderPage").classList.add("hidden");
}
function showFolder(key){
const folder=folders[key];if(!folder)return;
document.getElementById("homePage").classList.add("hidden");
document.getElementById("folderPage").classList.remove("hidden");
document.getElementById("folderTitle").textContent=folder.title;
document.getElementById("photoList").innerHTML=folder.files.map((file,i)=>`
<div class="file-row" onclick="openViewer(${i},'${key}')">
<img class="file-thumb" src="${file[1]}" alt="">
<div class="file-name">${file[0]}</div>
<div class="file-meta">${file[2]}</div>
<div class="file-type">${file[3]}</div>
</div>`).join("");
document.getElementById("folderSummary").textContent=folder.files.length+" files";
}
function openViewer(index,key){
const file=folders[key].files[index];
document.getElementById("viewerImage").src=file[1];
document.getElementById("viewerName").textContent=file[0]+" · "+file[2]+" · "+file[3];
document.getElementById("viewer").classList.add("show");
}
function closeViewer(event){
if(!event||event.target.id==="viewer"||event.target.className==="close")
document.getElementById("viewer").classList.remove("show");
}
function filterFolders(value){
value=value.toLowerCase();
document.querySelectorAll("#folderList tr").forEach(row=>row.style.display=row.dataset.name.includes(value)?"":"none");
}
</script>
