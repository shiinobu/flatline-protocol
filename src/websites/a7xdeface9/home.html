<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VerifiedAccess — Storefront</title>
<style>
    body { background:#0b0b0f; color:#d8d8d8; font-family: monospace; padding: 32px; overflow: hidden; }
    h1 { color:#7fffd4; }
    .tag { color:#888; }
    .marquee { height: 420px; overflow: hidden; position: relative; border:1px solid #333; }
    .marquee-track { position: absolute; top: 0; left: 0; width: 100%; animation: scroll-up 30s linear infinite; }
    .listing { padding: 12px 16px; border-bottom: 1px solid #222; }
    .listing a { color:#7fffd4; text-decoration: none; }
    .listing a:hover { text-decoration: underline; }
    .listing.sold { color:#665; }
    @keyframes scroll-up {
        from { transform: translateY(0); }
        to { transform: translateY(-50%); }
    }
</style>
</head>
<body>
<h1>VerifiedAccess</h1>
<p class="tag">verified network access, sold as-is. no refunds.</p>

<div class="marquee">
    <div class="marquee-track" id="marquee-track"></div>
</div>

<p class="tag">serious buyers only. contact through usual channels.</p>

<script>
const LOTS = [
    { slug: "lot-88", label: "LOT 88", desc: "Retail chain, EU region" },
    { slug: "lot-91", label: "LOT 91", desc: "Regional ISP, APAC" },
    { slug: "opn-14", label: "OPN 14", desc: "Logistics company, NA region" },
    { slug: "acc-52", label: "ACC 52", desc: "University network, EU" },
    { slug: null, label: "LOT 94", desc: "SOLD — no longer listed" },
    { slug: null, label: "REQ 33", desc: "SOLD — no longer listed" },
    { slug: null, label: "PKG 77", desc: "SOLD — no longer listed" },
    { slug: null, label: "ACC 19", desc: "SOLD — no longer listed" },
    { slug: null, label: "LOT 05", desc: "SOLD — no longer listed" },
    { slug: null, label: "OPN 102", desc: "SOLD — no longer listed" },
];

const shuffle = (arr) => {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
};

const renderItem = (item) =>
    item.slug
        ? `<div class="listing"><a href="/${item.slug}/">${item.label}</a> — ${item.desc}</div>`
        : `<div class="listing sold">${item.label} — ${item.desc}</div>`;

const shuffled = shuffle(LOTS);
const rendered = shuffled.map(renderItem).join("");
document.getElementById("marquee-track").innerHTML = rendered + rendered;
</script>
</body>
</html>
